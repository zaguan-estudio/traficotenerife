<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 100" width="600" height="100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="100" fill="url(#bg)"/>
  <!-- Bottom border accent -->
  <rect y="97" width="600" height="3" fill="#e8a000"/>
  <!-- House icon -->
  <g transform="translate(20, 18)">
    <!-- House shape -->
    <polygon points="32,0 64,30 54,30 54,64 10,64 10,30 0,30" fill="none" stroke="#e8a000" stroke-width="2.5"/>
    <rect x="24" y="42" width="16" height="22" fill="none" stroke="#e8a000" stroke-width="2"/>
    <!-- Window -->
    <rect x="14" y="34" width="12" height="10" fill="none" stroke="#e8a000" stroke-width="1.5"/>
  </g>
  <!-- Title: TRÁFICO TENERIFE -->
  <text x="100" y="50"
        font-family="Arial Black, Arial, Helvetica, sans-serif"
        font-size="30"
        font-weight="900"
        fill="#ffffff"
        letter-spacing="3">TRÁFICO TENERIFE</text>
  <!-- Subtitle -->
  <text x="101" y="72"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10.5"
        font-weight="400"
        fill="#e8a000"
        letter-spacing="4">INFORMACIÓN DEL ESTADO DEL TRÁFICO</text>
</svg>
